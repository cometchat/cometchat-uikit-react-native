// AGP and the Kotlin Gradle plugin come from the host app's root project (as in every RN
// template since 0.71). Pinning them here via a `buildscript` block fights the app's own
// versions — AGP 9 / Gradle 9 (RN 0.87) will not build with the old pins at all.

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") &&  rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: 'com.android.library'

// AGP 9 can compile Kotlin itself ("built-in Kotlin"), and applying kotlin-android on top of
// that fails. Apply it only when nothing has registered the `kotlin` extension yet, so this
// works both on AGP 9 and on the AGP 8 apps of older RN versions.
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: 'org.jetbrains.kotlin.android'
}

if (isNewArchitectureEnabled()) {
  apply plugin: 'com.facebook.react'
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['CometchatUiKit_' + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['CometchatUiKit_' + name]).toInteger()
}

android {
  namespace "com.reactnativecometchatuikit"
  compileSdkVersion getExtOrIntegerDefault('compileSdkVersion')

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault('minSdkVersion')
    targetSdkVersion getExtOrIntegerDefault('targetSdkVersion')
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable 'GradleCompatible'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // Version is supplied by the React Native Gradle Plugin of the host app.
  implementation "com.facebook.react:react-android"
  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'com.google.android.material:material:1.12.0'
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "CometchatUiKit"
    codegenJavaPackageName = "com.reactnativecometchatuikit"
  }
}
